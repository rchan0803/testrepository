# =============================================================================
# Threads 自動投稿作成ツール 設定ファイル
# =============================================================================
# スプレッドシートIDは .env ファイルで管理することも可能です。
# .env の値が優先されます。

# --- 参考用スプレッドシート (読み込み元) ---
# 構成: A列=種別(投稿1/リプ1), B列=テキスト → 2行で1投稿セット
source_sheet:
  # スプレッドシートID
  spreadsheet_id: "158dqDBXeqnI9eEmnqOvEc8weKLZnHF-u"

  # デフォルトで読み込むシート名
  # 将来的に投稿種類ごとにシートを分ける場合、ここを変更するか --sheet オプションで指定
  sheet_name: "名言シート"

  # 列マッピング
  columns:
    label: "A"   # 種別 (投稿1, リプ1, 投稿2, リプ2, ...)
    text: "B"    # テキスト本文

  # データ開始行 (1-indexed, ヘッダーなし)
  data_start_row: 1

# --- 自動投稿用スプレッドシート (転記先) ---
# 構成: A列=ツリー型(番号), B列=ポスト文 → 本文行+リプ行の2行で1投稿セット
dest_sheet:
  # スプレッドシートID
  spreadsheet_id: "1BYy8BzhGvGNDQ6XUFlvOlT-KUuZsQOV6mQ0URTD8kDE"

  # 書き込み先シート名
  sheet_name: "自動投稿"

  # 列マッピング
  columns:
    tree_type: "A"   # ツリー型 (番号: 同じ番号で本文+リプをグループ化)
    post_text: "B"   # ポスト文

  # ヘッダー行 (4行目がヘッダー)
  header_row: 4

  # データ開始行 (5行目からデータ)
  data_start_row: 5

# --- Claude API 設定 ---
claude:
  # APIキーは .env の ANTHROPIC_API_KEY で設定してください
  model: "claude-sonnet-4-20250514"
  max_tokens: 4096
  temperature: 0.8

# --- 投稿生成設定 ---
generation:
  # 1回の実行で生成する投稿数
  posts_per_run: 5

  # 本文の最大文字数 (Threadsの制限: 500文字)
  max_body_length: 500

  # リプライの最大文字数
  max_reply_length: 500

  # カスタムプロンプトテンプレート (空の場合はデフォルトを使用)
  # 使用可能な変数: {count}, {reference_posts}
  prompt_template: ""

# --- Google認証 ---
google_service_account_file: "credentials/service_account.json"
